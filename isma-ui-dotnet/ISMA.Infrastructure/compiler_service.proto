syntax = "proto3";

package ru.nstu.isma.contracts.simulation;

import "compile_request.proto";
import "compile_response.proto";
import "validate_request.proto";
import "delete_compiled_model_request.proto";
import "highlight_request.proto";
import "highlight_response.proto";

option csharp_namespace = "Isma.Contracts.Simulation";
option go_package = "github.com/isma/contracts/simulation";
option java_multiple_files = true;
option java_package = "ru.nstu.isma.contracts.simulation";

service LismaCompilerService {
  rpc Compile(CompileRequest) returns (CompileResponse);
  rpc Validate(ValidateRequest) returns (ValidateResponse);
  rpc Delete(DeleteCompiledModelRequest) returns (DeleteCompiledModelResponse);
  rpc Highlight(HighlightRequest) returns (HighlightResponse);
}
